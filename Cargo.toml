[workspace]
resolver = "3"
members = ["crates/*"]
exclude = [
    "examples/sort",
    "examples/rbtree",
    "examples/eval",
    "examples/church",
    "examples/fibonacci",
    "examples/sum",
    "examples/ackermann",
    "examples/reverse",
    "examples/map_filter",
    "examples/tree",
    "examples/fsm",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/vbergeron/encore"
readme = "README.md"
