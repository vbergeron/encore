[package]
name = "encore-toolchain"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Compiler and bytecode VM for Fleche, a functional language with first-class continuations"
keywords = ["compiler", "vm", "functional", "cps", "bytecode"]
categories = ["compilers", "command-line-utilities"]

[[bin]]
name = "encore"
path = "src/main.rs"

[features]
stats = ["encore_vm/stats"]

[dependencies]
clap = { version = "4", features = ["derive"] }
encore_compiler = { path = "../encore_compiler", version = "0.1.6" }
encore_disasm = { path = "../encore_disasm", version = "0.1.6" }
encore_fleche = { path = "../encore_fleche", version = "0.1.6" }
encore_scheme = { path = "../encore_scheme", version = "0.1.6" }
encore_vm = { path = "../encore_vm", version = "0.1.6" }
